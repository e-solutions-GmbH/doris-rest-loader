# Pre-commit configuration.
#
# Install once per clone with:
#   pre-commit install --hook-type commit-msg
#
# See https://pre-commit.com/ and CONTRIBUTING.md for details.

repos:
  # Enforce Conventional Commits on every commit message.
  # https://github.com/compilerla/conventional-pre-commit
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          # Explicit list of allowed types. Keep in sync with CONTRIBUTING.md.
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2 # Use the latest stable version of Gitleaks
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets in committed changes
        description: Detect hardcoded secrets in committed changes on the branch
        entry: gitleaks git -v --log-opts="master.." --config=./gitleaks.toml
        pass_filenames: false

      - id: gitleaks
        name: Detect hardcoded secrets in staged files
        description: Detect hardcoded secrets in staged files
        entry: gitleaks git -v --staged --config=./gitleaks.toml
        pass_filenames: false
        
      - id: gitleaks
        name: Detect hardcoded secrets in unstaged files
        description: Detect hardcoded secrets in staged files
        entry: gitleaks git -v --pre-commit --config=./gitleaks.toml
        pass_filenames: false